<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HSK 4 级受控分级阅读与测评生成器</title>
  <meta name="description" content="面向 HSK 4 级学习者的受控分级阅读材料与测评题目生成工具，香港理工大学二语教学研究项目。" />
  <style>
    :root {
      --bar-h: 56px;
      --embed-bottom-mask: 48px;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #e5e7eb;
      --accent: #b91c1c;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #21262d;
        --accent: #dc2626;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
                   "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    .topbar {
      flex: 0 0 auto;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .brand { display: flex; flex-direction: column; min-width: 0; }
    .brand .title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand .subtitle {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .cta {
      flex: 0 0 auto;
      display: inline-block;
      padding: 7px 12px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .cta:hover { opacity: .9; }
    .link-lite {
      color: var(--muted);
      font-size: 12px;
      text-decoration: none;
      white-space: nowrap;
    }
    .link-lite:hover { text-decoration: underline; }
    .stage {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .stage iframe {
      position: absolute;
      inset: 0 0 calc(var(--embed-bottom-mask) * -1) 0;
      width: 100%;
      height: calc(100% + var(--embed-bottom-mask));
      border: 0;
      display: block;
    }
    .stage::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 8px;
      background: var(--bg);
      pointer-events: none;
    }
    @media (max-width: 640px) {
      .brand .subtitle { display: none; }
      .cta { padding: 7px 10px; font-size: 12px; }
      .link-lite { display: none; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="title">HSK 4 级受控分级阅读与测评生成器</div>
        <div class="subtitle">香港理工大学 · 二语教学（L2 Pedagogy）学位研究项目</div>
      </div>
      <div class="actions">
        <a class="link-lite" href="https://hsk-level-4-controlled-graded-reading-and-assessment-generator.streamlit.app/" target="_blank" rel="noopener noreferrer">打开全功能版（可折叠侧边栏）</a>
        <a class="cta" href="https://v.wjx.cn/vm/w2FDyLB.aspx#" target="_blank" rel="noopener noreferrer">填写专家评估量表</a>
      </div>
    </header>
    <main class="stage">
      <iframe
        src="https://hsk-level-4-controlled-graded-reading-and-assessment-generator.streamlit.app/?embed=true"
        title="HSK 4 级受控分级阅读与测评生成器"
        allow="clipboard-write; fullscreen"
      ></iframe>
    </main>
  </div>
</body>
</html>
