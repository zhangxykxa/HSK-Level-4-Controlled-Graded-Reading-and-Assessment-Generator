<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>HSK 4 级受控分级阅读与测评生成器</title>
  <meta name="description" content="面向 HSK 4 级学习者的受控分级阅读材料与测评题目生成工具，香港理工大学二语教学研究项目。" />
  <style>
    :root {
      --bar-h: 56px;
      --embed-bottom-mask: 48px;
      --bg: #ffffff;
      --fg: #1f2328;
      --muted: #656d76;
      --border: #e5e7eb;
      --accent: #b91c1c;
      --accent-fg: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0e1117;
        --fg: #e6edf3;
        --muted: #8b949e;
        --border: #21262d;
        --accent: #dc2626;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
                   "PingFang SC", "Hiragino Sans GB", sans-serif;
    }
    .shell {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
    }
    .topbar {
      flex: 0 0 auto;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }
    .brand { display: flex; flex-direction: column; min-width: 0; }
    .brand .title {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand .subtitle {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.3;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }
    .cta {
      flex: 0 0 auto;
      display: inline-block;
      padding: 7px 12px;
      border-radius: 8px;
      background: var(--accent);
      color: var(--accent-fg);
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      white-space: nowrap;
    }
    .cta:hover { opacity: .9; }
    .stage {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      overflow: hidden;
    }
    .stage iframe.app-frame {
      position: absolute;
      inset: 0 0 calc(var(--embed-bottom-mask) * -1) 0;
      width: 100%;
      height: calc(100% + var(--embed-bottom-mask));
      border: 0;
      display: block;
    }
    .stage::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 8px;
      background: var(--bg);
      pointer-events: none;
    }

    /* ---- 冷启动遮罩 ---- */
    .wake-overlay {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      transition: opacity .4s ease;
    }
    .wake-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .wake-overlay .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .wake-overlay .msg {
      font-size: 14px;
      color: var(--muted);
      text-align: center;
      max-width: 320px;
      line-height: 1.5;
    }
    .wake-overlay .msg strong { color: var(--fg); }
    .wake-overlay .retry-link {
      font-size: 13px;
      color: var(--accent);
      text-decoration: none;
      cursor: pointer;
      padding: 8px 16px;
      border: 1px solid var(--accent);
      border-radius: 8px;
      display: none;
    }
    .wake-overlay .retry-link:hover { background: var(--accent); color: var(--accent-fg); }

    @media (max-width: 640px) {
      .brand .subtitle { display: none; }
      .cta { padding: 7px 10px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="title">HSK 4 级受控分级阅读与测评生成器</div>
        <div class="subtitle">香港理工大学 · 二语教学（L2 Pedagogy）学位研究项目</div>
      </div>
      <div class="actions">
        <a class="cta" href="https://v.wjx.cn/vm/w2FDyLB.aspx#" target="_blank" rel="noopener noreferrer">填写专家评估量表</a>
      </div>
    </header>
    <main class="stage">
      <div class="wake-overlay" id="wakeOverlay">
        <div class="spinner"></div>
        <div class="msg" id="wakeMsg">
          <strong>正在唤醒云端应用</strong><br />
          首次访问需约 30–60 秒启动，请稍候。
        </div>
        <a class="retry-link" id="retryLink">点击重新加载</a>
      </div>
      <iframe
        class="app-frame"
        id="appFrame"
        title="HSK 4 级受控分级阅读与测评生成器"
        allow="clipboard-write; fullscreen"
      ></iframe>
    </main>
  </div>

  <script>
    (function () {
      var APP_URL = "https://hsk-level-4-controlled-graded-reading-and-assessment-generator.streamlit.app";
      var BASE_SRC = APP_URL + "/?embed=true&hsk_shell=1";
      var SRC = BASE_SRC;
      var IP_WAIT = 2000;   // 查询访客 IP / 归属地的最长等待时间，超时就直接加载

      // iframe 的 onload 触发得太早：平台 nginx 会先返回一个静态 SPA 外壳，
      // 约 0.5 秒就 load 完了，此时 Python 进程可能还在冷启动。跨域又拿不到
      // 应用内部状态，所以只能「固定最短展示时长」来掩盖 Streamlit 自身的
      // 加载界面，而不是一收到 onload 就撤掉遮罩。
      var MIN_SHOW = 7000;   // 遮罩最短展示时长
      var SLOW_AFTER = 20000; // 超过此时长仍无 onload -> 换文案
      var FAIL_AFTER = 60000; // 超过此时长仍无 onload -> 给出重试按钮

      var frame = document.getElementById("appFrame");
      var overlay = document.getElementById("wakeOverlay");
      var msg = document.getElementById("wakeMsg");
      var retry = document.getElementById("retryLink");

      var startedAt = 0;
      var loaded = false;
      var hideTimer = null;
      var slowTimer = null;
      var failTimer = null;

      function clearTimers() {
        clearTimeout(hideTimer);
        clearTimeout(slowTimer);
        clearTimeout(failTimer);
      }

      function begin() {
        loaded = false;
        startedAt = Date.now();
        clearTimers();
        retry.style.display = "none";
        msg.innerHTML = "<strong>正在唤醒云端应用</strong><br />首次访问需约 30–60 秒启动，请稍候。";
        overlay.classList.remove("hidden");

        slowTimer = setTimeout(function () {
          if (!loaded) {
            msg.innerHTML = "<strong>仍在唤醒云端应用</strong><br />应用正在启动，通常 30–60 秒内完成。";
          }
        }, SLOW_AFTER);

        failTimer = setTimeout(function () {
          if (!loaded) {
            msg.innerHTML = "<strong>加载超时</strong><br />请检查网络后点击下方按钮重新加载。";
            retry.style.display = "inline-block";
          }
        }, FAIL_AFTER);
      }

      // 应用渲染完成（或加载失败）后触发
      frame.addEventListener("load", function () {
        loaded = true;
        clearTimeout(slowTimer);
        clearTimeout(failTimer);
        var wait = Math.max(MIN_SHOW - (Date.now() - startedAt), 0);
        hideTimer = setTimeout(function () {
          overlay.classList.add("hidden");
        }, wait);
      });

      retry.addEventListener("click", function () {
        frame.src = "";
        setTimeout(function () {
          frame.src = SRC;
          begin();
        }, 150);
      });

      // Streamlit Cloud 的代理不透传 X-Forwarded-For，后端只能看到平台内网地址，
      // 所以改由浏览器直接查询访客公网 IP 与归属地，再用 hsk_ip / hsk_region 参数
      // 交给应用落库（应用只保留 IP 网段，如 116.25.x.x）。
      var IP_PROVIDERS = [
        {
          url: "https://ipwho.is/",
          pick: function (d) {
            return (d && d.success !== false && d.ip) ? [d.ip, [d.country, d.region, d.city]] : null;
          }
        },
        {
          url: "https://ipinfo.io/json",
          pick: function (d) {
            return (d && d.ip) ? [d.ip, [d.city, d.region]] : null;
          }
        },
        {
          url: "https://api.ipify.org?format=json",
          pick: function (d) { return (d && d.ip) ? [d.ip, []] : null; }
        }
      ];

      function joinParts(list) {
        var parts = [];
        (list || []).forEach(function (s) {
          if (s && parts.indexOf(s) === -1) { parts.push(s); }
        });
        return parts.join(" · ");
      }

      function lookupIp() {
        return new Promise(function (resolve) {
          var deadline = Date.now() + IP_WAIT;
          var i = 0;
          (function next() {
            if (i >= IP_PROVIDERS.length || Date.now() >= deadline) { resolve(null); return; }
            var p = IP_PROVIDERS[i++];
            var ctl = new AbortController();
            var timer = setTimeout(function () { ctl.abort(); }, Math.max(deadline - Date.now(), 300));
            fetch(p.url, { signal: ctl.signal })
              .then(function (r) { return r.json(); })
              .then(function (d) {
                clearTimeout(timer);
                var v = p.pick(d);
                if (v && v[0]) { resolve([v[0], joinParts(v[1])]); } else { next(); }
              })
              .catch(function () { clearTimeout(timer); next(); });
          })();
        });
      }

      lookupIp().then(function (v) {
        if (v && v[0]) {
          SRC = BASE_SRC + "&hsk_ip=" + encodeURIComponent(v[0]);
          if (v[1]) { SRC += "&hsk_region=" + encodeURIComponent(v[1]); }
        }
        frame.src = SRC;
        begin();
      });
    })();
  </script>
</body>
</html>
