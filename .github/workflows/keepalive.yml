name: Streamlit Keep-Alive

# 用「真实浏览器访问」防止 Streamlit Community Cloud 免费层进入 12 小时闲置休眠。
#
# ⚠️ 为什么不用 curl / UptimeRobot：
#   平台只把"执行了 JS 并建立了 WebSocket 会话的浏览器访问"算作活动。纯 HTTP GET
#   无论打哪个路径都不会唤醒沉睡的应用，只能拿到 nginx 托管的静态 SPA 外壳
#   （约 9782 字节），表现为一次"假成功"（历史上有 18 次 success 却仍在休眠）。
#
# 路径归属备忘：
#   /                       -> 平台 nginx 静态 SPA 外壳（9782 B）
#   /_stcore/health         -> 同上，被 nginx 兜底路由
#   /healthz                -> nginx 边缘健康检查（与应用容器无关）
#   /~/+/                   -> 应用容器自身的 index.html（6467 B）
#   /~/+/_stcore/health     -> 应用容器存活探针：醒着返回 ok，休眠返回 400
on:
  schedule:
    # 每 2 小时一次（cron 使用 UTC）。休眠阈值是 12 小时，留 6 倍余量以对冲
    # GitHub Actions schedule 的 best-effort 延迟（高峰期可能推迟数小时）。
    - cron: "0 */2 * * *"
  # 改动了保活逻辑就立刻跑一次验证（仅限这两个文件，普通的业务提交不会触发）
  push:
    paths:
      - ".github/workflows/keepalive.yml"
      - ".github/scripts/keepalive.py"
  # 支持在 Actions 页面手动触发一次，便于验证
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Visit app with a headless browser (keep alive / wake)
        run: python .github/scripts/keepalive.py
